<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Analyzer & Translator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      background-image: url('doc.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .card {
      background-color: ghostwhite;
      border-radius: 1.5rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
        0 4px 6px -2px rgba(0, 0, 0, 0.05);
      padding: 2.5rem;
      transition: all 0.3s ease-in-out;
    }

    .card:hover {
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1),
        0 10px 10px -5px rgba(0, 0, 0, 0.04);
      transform: translateY(-5px);
    }

    .scrollable-content {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #e5e7eb;
      border-radius: 0.75rem;
      padding: 1rem;
    }

    #analysis-chart {
      width: 100%;
      height: auto;
    }

    .gradient-bg {
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
    }
  </style>
</head>

<body class="p-6 md:p-12">
  <div class="flex flex-col gap-16 max-w-7xl mx-auto">
    <!-- Main Application Header -->
    <header class="text-center flex flex-col items-center">
      <h1 class="text-5xl md:text-6xl font-extrabold text-gray-900 mb-4">
        Document Analyzer & Translator
      </h1>
      <p class="text-lg text-gray-600 max-w-2xl mb-6" style="color: darkblue;">
        Effortlessly analyze your documents, visualize key insights, and break down language barriers with our powerful all-in-one tool.
      </p>
      <div class="relative w-full max-w-md h-40 rounded-3xl overflow-hidden shadow-2xl">
        <video autoplay loop muted playsinline class="background-video">
          <source src="video.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    </header>

    <!-- Main Content Area -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
      <!-- Text Input and Analysis Section -->
      <div class="card flex flex-col gap-8">
        <h2 class="text-3xl font-bold text-gray-800 flex items-center gap-4">
          Document Analysis
        </h2>
        <div class="flex flex-col gap-6">
          <textarea id="document-input" rows="10"
            class="w-full p-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-blue-500/50 transition duration-300 placeholder-gray-400"
            placeholder="Paste your document text here..."></textarea>
          <div class="flex flex-col sm:flex-row items-center gap-4">
            <label for="file-input"
              class="flex-1 w-full sm:w-auto text-center cursor-pointer bg-gray-200 text-gray-800 font-semibold py-3 px-6 rounded-xl shadow-md hover:bg-gray-300 transition-all duration-300 hover:scale-[1.02]">
              Import Document from Device
            </label>
            <input type="file" id="file-input" accept=".txt,.md" class="hidden">
            <span id="file-name"
              class="flex-1 text-sm text-gray-500 italic text-center sm:text-left">No file selected</span>
          </div>
        </div>
        <button onclick="analyzeDocument()"
          class="w-full gradient-bg text-white font-semibold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 hover:scale-[1.02] transform">
          Analyze Document
        </button>

        <!-- Analysis Results Section -->
        <div id="analysis-results" class="flex flex-col gap-8 hidden">
          <div>
            <h3 class="text-2xl font-bold text-gray-800 mb-4">Summary</h3>
            <div id="summary-output" class="scrollable-content bg-gray-50 text-gray-700 text-base"></div>
          </div>
          <div>
            <h3 class="text-2xl font-bold text-gray-800 mb-4">Most Frequent Words</h3>
            <div class="relative h-64 md:h-96">
              <canvas id="analysis-chart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <!-- Translator Section -->
      <div class="card flex flex-col gap-8">
        <h2 class="text-3xl font-bold text-gray-800 flex items-center gap-4">
          Text Translator
        </h2>
        <div class="flex flex-col gap-6">
          <textarea id="translator-input" rows="5"
            class="w-full p-4 border border-gray-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-purple-500/50 transition duration-300 placeholder-gray-400"
            placeholder="Enter text to translate..."></textarea>
          <div class="flex flex-col sm:flex-row gap-4">
            <button id="en-to-hi-btn"
              class="flex-1 gradient-bg text-white font-semibold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 hover:scale-[1.02] transform">
              English to Hindi
            </button>
            <button id="hi-to-en-btn"
              class="flex-1 bg-purple-200 text-purple-800 font-semibold py-3 px-6 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 hover:scale-[1.02] transform">
              Hindi to English
            </button>
          </div>
          <div id="translator-output" class="scrollable-content bg-gray-50 text-gray-700 text-base"></div>
          <div id="translator-loading" class="text-center text-purple-600 hidden">
            <svg class="animate-spin h-8 w-8 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none"
              viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 
                5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 
                5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="mt-2 font-semibold">Translating...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Stop words list
    const stopWords = new Set([
      "a", "about", "above", "after", "again", "against", "all", "am", "an", "and",
      "any", "are", "as", "at", "be", "because", "been", "before", "being", "below",
      "between", "both", "but", "by", "can", "cannot", "could", "did", "do", "does",
      "doing", "down", "during", "each", "few", "for", "from", "further", "had",
      "has", "have", "having", "he", "her", "here", "hers", "herself", "him", "himself",
      "his", "how", "i", "if", "in", "into", "is", "it", "its", "itself", "just", "me",
      "more", "most", "my", "myself", "no", "nor", "not", "of", "off", "on", "once",
      "only", "or", "other", "our", "ours", "ourselves", "out", "over", "own", "same",
      "she", "should", "so", "some", "such", "than", "that", "the", "their", "theirs",
      "them", "themselves", "then", "there", "these", "they", "this", "those", "through",
      "to", "too", "under", "until", "up", "very", "was", "we", "were", "what", "when",
      "where", "which", "while", "who", "whom", "why", "with", "would", "you", "your",
      "yours", "yourself", "yourselves"
    ]);

    let chartInstance = null;

    function cleanText(text) {
      return text.toLowerCase().replace(/[^\p{L}\s]/gu, '');
    }

    function summarizeText(text) {
      const sentences = text.match(/[^.!?]+[.!?]+/g) || [];
      const summaryLength = Math.ceil(sentences.length * 0.2);
      return sentences.slice(0, summaryLength).join(' ').trim() || "Could not generate a summary.";
    }

    function analyzeDocument() {
      const documentInput = document.getElementById('document-input').value;
      const summaryOutput = document.getElementById('summary-output');
      const analysisResults = document.getElementById('analysis-results');

      if (!documentInput.trim()) {
        summaryOutput.textContent = "Please enter some text to analyze.";
        analysisResults.classList.remove('hidden');
        return;
      }

      const cleanedText = cleanText(documentInput);
      const words = cleanedText.split(/\s+/).filter(word => word.length > 0 && !stopWords.has(word));

      const wordFrequencies = {};
      words.forEach(word => {
        wordFrequencies[word] = (wordFrequencies[word] || 0) + 1;
      });

      const sortedWords = Object.entries(wordFrequencies).sort(([, a], [, b]) => b - a);
      const topWords = sortedWords.slice(0, 10);

      summaryOutput.textContent = summarizeText(documentInput);

      updateChart(topWords);
      analysisResults.classList.remove('hidden');
    }

    function updateChart(data) {
      const labels = data.map(([word]) => word);
      const values = data.map(([, count]) => count);
      const ctx = document.getElementById('analysis-chart').getContext('2d');

      const colors = [
        '#a855f7', '#f59e0b', '#10b981', '#3b82f6', '#ef4444',
        '#8b5cf6', '#22c55e', '#f97316', '#6366f1', '#ec4899'
      ];

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'pie',
        data: { labels, datasets: [{ data: values, backgroundColor: colors }] },
        options: { responsive: true, plugins: { legend: { position: 'top' } } }
      });
    }

    // Free LibreTranslate API
    async function translateLibre(sourceLang, targetLang) {
      const input = document.getElementById("translator-input").value.trim();
      const output = document.getElementById("translator-output");
      const loading = document.getElementById("translator-loading");

      if (!input) {
        output.textContent = "Please enter text to translate.";
        return;
      }

      loading.classList.remove("hidden");
      output.textContent = "";

      try {
        const res = await fetch("https://libretranslate.de/translate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            q: input,
            source: sourceLang,
            target: targetLang,
            format: "text"
          })
        });

        const data = await res.json();
        output.textContent = data.translatedText || "Translation failed.";
      } catch (err) {
        console.error(err);
        output.textContent = "Error during translation.";
      } finally {
        loading.classList.add("hidden");
      }
    }

    function handleFileImport(event) {
      const file = event.target.files[0];
      const fileNameSpan = document.getElementById('file-name');
      const documentInput = document.getElementById('document-input');

      if (file) {
        fileNameSpan.textContent = file.name;
        const reader = new FileReader();
        reader.onload = (e) => documentInput.value = e.target.result;
        reader.readAsText(file);
      } else {
        fileNameSpan.textContent = 'No file selected';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('file-input').addEventListener('change', handleFileImport);
      document.getElementById('en-to-hi-btn').addEventListener('click', () => translateLibre("en", "hi"));
      document.getElementById('hi-to-en-btn').addEventListener('click', () => translateLibre("hi", "en"));
    });
  </script>
</body>
</html>
